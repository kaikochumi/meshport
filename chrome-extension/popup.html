<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meshport</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header class="top">
        <div class="brand">
          <span class="mark" aria-hidden="true">
            <img src="icons/icon-128.png" alt="">
          </span>
          <div class="brand-text">
            <h1>Meshport</h1>
            <p>Tripo Studio exporter</p>
          </div>
        </div>
        <button id="scan" class="icon-button" type="button" title="Rescan your library" aria-label="Rescan your library">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 11a8 8 0 1 0-.7 4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 4v7h-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </header>

      <nav class="tabs" role="tablist" aria-label="Views">
        <button id="tab-export" class="tab" type="button" role="tab" aria-selected="true" aria-controls="view-export">Export</button>
        <button id="tab-settings" class="tab" type="button" role="tab" aria-selected="false" aria-controls="view-settings">Settings</button>
      </nav>

      <div id="view-export" class="view" role="tabpanel" aria-labelledby="tab-export">
        <section>
          <div class="section-head">
            <h2>Model</h2>
            <span id="model-count" class="count">0</span>
          </div>
          <div id="links" class="models" role="listbox" aria-label="Tripo library models">
            <p class="empty">Reading your Tripo library...</p>
          </div>
        </section>

        <div class="field">
          <label for="base-name">File name</label>
          <input id="base-name" type="text" placeholder="model" autocomplete="off" spellcheck="false">
        </div>

        <section>
          <div class="section-head">
            <h2>Format</h2>
          </div>
          <div class="formats" role="radiogroup" aria-label="Output format">
            <label class="format" title="Geometry only. No color or textures. Best for 3D printing.">
              <input type="radio" name="format" value="stl" checked>
              <span class="format-body">
                <strong>STL</strong>
                <small>Mesh only, for slicers</small>
              </span>
            </label>
            <label class="format" title="Zipped OBJ with a material file and textures. Opens in most 3D tools.">
              <input type="radio" name="format" value="obj">
              <span class="format-body">
                <strong>OBJ</strong>
                <small>Mesh, MTL and textures</small>
              </span>
            </label>
            <label class="format" title="Zipped .gltf, .bin and textures. The modern scene format.">
              <input type="radio" name="format" value="gltf">
              <span class="format-body">
                <strong>glTF</strong>
                <small>Separate files + textures</small>
              </span>
            </label>
            <label class="format" title="Single binary file with geometry and textures inside.">
              <input type="radio" name="format" value="glb">
              <span class="format-body">
                <strong>GLB</strong>
                <small>One file with everything</small>
              </span>
            </label>
            <label class="format" title="Tripo's native file, exactly as stored. Keeps quad topology for Blender.">
              <input type="radio" name="format" value="fbx">
              <span class="format-body">
                <strong>FBX</strong>
                <small>Native file from Tripo</small>
              </span>
            </label>
            <label class="format" title="Base color, normal and other maps, without the mesh.">
              <input type="radio" name="format" value="textures">
              <span class="format-body">
                <strong>Textures only</strong>
                <small>Every map in one zip</small>
              </span>
            </label>
          </div>
        </section>

        <label class="switch-row" id="png-row">
          <span class="switch-text">
            <strong>Convert textures to PNG</strong>
            <small>Used by OBJ and glTF</small>
          </span>
          <input id="png" type="checkbox" checked>
          <span class="switch" aria-hidden="true"></span>
        </label>

        <details id="texture-box" class="textures" hidden>
          <summary>
            <span id="texture-summary">Textures</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m7 10 5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </summary>
          <ul id="texture-list"></ul>
        </details>

        <footer>
          <div class="status-row">
            <span class="dot" aria-hidden="true"></span>
            <p id="status" aria-live="polite">Ready.</p>
          </div>
          <progress id="progress" hidden></progress>
          <div class="actions">
            <button id="inspect" class="ghost" type="button">Inspect</button>
            <button id="convert" type="button">Download STL</button>
          </div>
        </footer>
      </div>

      <div id="view-settings" class="view" role="tabpanel" aria-labelledby="tab-settings" hidden>
        <section class="setting">
          <div class="section-head">
            <h2>Save location</h2>
          </div>
          <label class="switch-row" id="ask-save-row">
            <span class="switch-text">
              <strong>Ask where to save</strong>
              <small>Choose a folder for every download.</small>
            </span>
            <input id="ask-save" type="checkbox">
            <span class="switch" aria-hidden="true"></span>
          </label>
          <div class="field folder-block" id="folder-field">
            <div class="folder-head">
              <label for="subfolder">Subfolder in Downloads</label>
              <button id="open-downloads" class="link-button" type="button">Open Downloads</button>
            </div>
            <input id="subfolder" type="text" placeholder="Meshport" autocomplete="off" spellcheck="false">
            <p class="path-preview" id="path-preview">Downloads/Meshport/model.glb</p>
          </div>
          <p class="hint" id="save-note">Files stay inside Downloads.</p>
        </section>

        <section class="setting">
          <div class="section-head">
            <h2>Default format</h2>
          </div>
          <div class="chips" id="default-formats" role="radiogroup" aria-label="Default output format">
            <label class="chip"><input type="radio" name="default-format" value="stl" checked><span>STL</span></label>
            <label class="chip"><input type="radio" name="default-format" value="obj"><span>OBJ</span></label>
            <label class="chip"><input type="radio" name="default-format" value="gltf"><span>glTF</span></label>
            <label class="chip"><input type="radio" name="default-format" value="glb"><span>GLB</span></label>
            <label class="chip"><input type="radio" name="default-format" value="fbx"><span>FBX</span></label>
            <label class="chip"><input type="radio" name="default-format" value="textures"><span>Textures</span></label>
          </div>
        </section>

        <section class="setting about">
          <div class="about-brand">
            <img class="about-mark" src="icons/m-mark.png" alt="" width="44" height="44">
            <div class="about-text">
              <p class="about-name">Meshport <span id="version">0.3.2</span></p>
              <p class="about-by">Built by <a href="https://github.com/kaikochumi" target="_blank" rel="noreferrer">@kaikochumi</a></p>
            </div>
          </div>
          <div class="about-actions">
            <span id="preview-count" class="about-count">No previews cached</span>
            <button id="clear-previews" class="link-button" type="button">Clear previews</button>
            <button id="reset-settings" class="link-button" type="button">Reset settings</button>
          </div>
        </section>
      </div>
    </main>

    <iframe id="sandbox" src="sandbox.html" hidden></iframe>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
