name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: zip -qr "meshport-${{ github.ref_name }}.zip" chrome-extension

      # Update the body below when you tag the next version.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Meshport ${{ github.ref_name }}
          files: meshport-${{ github.ref_name }}.zip
          body: |
            You can now queue several models and let Meshport export them one at a time.

            Search and sort work on the library you already scanned. Type a name to filter it, switch between newest and name order, then tick the cards you want or press Select all for whatever the search shows. Export N sends that selection to the queue.

            Each queue item moves through waiting, exporting, done, failed, or cancelled. Cancel an item that has not started, retry a failed one, and clear finished work when the list gets long. The header badge counts what is still unfinished. The queue is stored in chrome.storage.session: a popup reload keeps finished items, and an item that was mid-flight comes back as failed with an interrupted message.

            Batch export does not open or move your Tripo tab. If Tripo cannot resolve a model as a GLB without that step, the item fails with a note to open it once and rescan, and the rest of the batch continues. On Meshy, the popup now lists the whole workspace library and keeps the signed links the workspace page fetched, so you can queue models you never opened as long as the workspace has listed them. A model the page never loaded has no link: its card tells you to open it once, its checkbox stays disabled, and Select all leaves it out. FBX remains Tripo-only.

            Tripo and Meshy still share the rest of the workflow: covers, verified downloads, the native FBX path, and Meshy reading with the session already active in your browser.

            To install, unpack the zip and load the chrome-extension folder from your browser's extensions page with developer mode on. The README has the full steps. After updating, reload your Tripo and Meshy tabs so the new content scripts go live.
