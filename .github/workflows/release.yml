name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag.removeprefix("v")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^## \[{re.escape(version)}\] - [^\n]+\n(.*?)(?=^## \[|\Z)"
          match = re.search(pattern, changelog)
          if match is None:
              raise SystemExit(f"Missing changelog entry for {tag}")

          notes = (
              f"Meshport {version} adds export presets, an interactive 3D preview, "
              "and local download history, with improvements to library loading "
              "and large-file handling.\n\n"
              f"## Changes\n\n{match.group(1).strip()}\n\n"
              "## Install or update\n\n"
              f"1. Download `meshport-{tag}.zip` from the assets below and extract it.\n"
              "2. Open `chrome://extensions` (Chrome) or `edge://extensions` (Edge).\n"
              "3. Enable **Developer mode**, then select **Load unpacked**.\n"
              "4. Choose the extracted `chrome-extension` folder.\n\n"
              "To update an existing installation, replace the extension folder "
              "and click **Reload** on the extensions page. Reload your Tripo "
              "and Meshy tabs afterwards.\n\n"
              "FBX exports are available for Tripo models only.\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Package the extension
        run: |
          zip -qr "meshport-${{ github.ref_name }}.zip" chrome-extension
          sha256sum "meshport-${{ github.ref_name }}.zip" > "meshport-${{ github.ref_name }}.sha256"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Meshport ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            meshport-${{ github.ref_name }}.zip
            meshport-${{ github.ref_name }}.sha256
          fail_on_unmatched_files: true
