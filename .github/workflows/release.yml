name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Zip the extension
        run: zip -qr "meshport-${{ github.ref_name }}.zip" chrome-extension

      # Update the body below when you tag the next version.
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: Meshport ${{ github.ref_name }}
          files: meshport-${{ github.ref_name }}.zip
          body: |
            Meshy joins Tripo.

            The popup now has a Tripo and Meshy switch. On Meshy, it reads the model you have open in your workspace and saves it as STL, OBJ, glTF, GLB, or a zip of textures. Download links expire after a while, so Meshport asks the open tab for a fresh one and retries by itself. There is no FBX on Meshy, because that native file only exists inside a Tripo project.

            Tripo keeps everything from before: the full library with covers, verified downloads, and the native FBX path.

            Install: unpack the zip and load the chrome-extension folder on your browser's extensions page with developer mode on. The README has the full steps. After updating, reload your Tripo and Meshy tabs so the new content scripts go live.
